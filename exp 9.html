<!DOCTYPE html>
<html>
<head>
    <title>TechSavvy - Login</title>
    <style>
        body{
            margin:0;
            font-family:Arial, sans-serif;
            background:#f4f4f4;
        }

        header{
            background:#0a5eb0;
            color:white;
            text-align:center;
            padding:20px;
        }

        .login-box{
            width:350px;
            background:white;
            margin:60px auto;
            padding:25px;
            border-radius:8px;
            box-shadow:0 0 10px gray;
        }

        h2{
            text-align:center;
            color:#0a5eb0;
        }

        label{
            font-weight:bold;
        }

        input[type=text],
        input[type=password]{
            width:100%;
            padding:10px;
            margin:8px 0 15px;
            border:1px solid #ccc;
            border-radius:5px;
        }

        button{
            width:100%;
            background:#0a5eb0;
            color:white;
            border:none;
            padding:12px;
            font-size:16px;
            border-radius:5px;
            cursor:pointer;
        }

        button:hover{
            background:#084b8a;
        }

        .links{
            text-align:center;
            margin-top:15px;
        }

        .links a{
            text-decoration:none;
            color:#0a5eb0;
            margin:0 10px;
        }

        footer{
            background:#333;
            color:white;
            text-align:center;
            padding:15px;
            margin-top:50px;
        }
    </style>
</head>

<body>

<header>
    <h1>TechSavvy Online Shopping</h1>
    <p>Login to Continue Shopping</p>
</header>

<div class="login-box">

    <h2>User Login</h2>

    <form action="index.html">

        <label>Email / Username</label>
        <input type="text" placeholder="Enter Username or Email" required>

        <label>Password</label>
        <input type="password" placeholder="Enter Password" required>

        <button type="submit">Login</button>

    </form>

    <div class="links">
        <a href="#">Forgot Password?</a> |
        <a href="register.html">Register</a>
    </div>

</div>

<footer>
    <p>© 2026 TechSavvy Online Shopping</p>
</footer>

</body>
</html>
